sync:
  defaults:
    mode: two-way-safe
    symlink:
      mode: portable
    ignore:
      vcs: true
      paths:
        - node_modules
        - .venv
        - venv
        - __pycache__
        - "*.pyc"
        - .pixi
        - __pypackages__
        - .cache
        - .pytest_cache
        - .mypy_cache
        - .ruff_cache
        - .tox
        - .coverage
        - htmlcov
        - "*.egg-info"
        - .eggs
        - target
        - dist
        - build
        - .next
        - .nuxt
        - .turbo
        - .parcel-cache
        - .wrangler
        - .open-next
        - .sass-cache
        - .DS_Store
        - "*.log"
        - "*.swp"
        - "*.swo"
        - .env
        - .env.local
        - .env*.local
        - .env.prod
        - .env.ops
        - .dev.vars
        - Team.xcconfig
        - .claude/settings.local.json
        - .claude/worktrees
        - .claude/plans
        - .claude/specs
        - .claude/launch.json
