        - lib/blog-posts.generated.ts
        - audit
        - courses/AWS-SAA-SAAC003-cantrill
        - homelab/pihole/etc-pihole
        - homelab/pihole/etc-dnsmasq.d
        - homelab/jellyfin/config
        - homelab/jellyfin/cache
        - "*.mp3"
        - "*.mp4"
        - homelab/yamtrack/redis/dump.rdb
        - "*.db-wal"
        - "*.db-shm"
        - "*.db-journal"
